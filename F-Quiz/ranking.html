<main class="ranking">

    <span class="tag">
        DESAFIO
    </span>


    <h1>
        RANKING
    </h1>


    <p>
        Veja como você se saiu!
    </p>


    <div id="listaRanking"></div>


    <button
        class="btn-principal"
        onclick="location.href='quiz.html'">

        JOGAR NOVAMENTE →

    </button>

</main>


<script>

const ranking =
    JSON.parse(
        localStorage.getItem("ranking")
    ) || [];


const lista =
    document.getElementById("listaRanking");


if (ranking.length === 0) {

    lista.innerHTML = `
        <div class="sem-ranking">
            Ainda não existem jogadores.
        </div>
    `;

}


ranking.slice(0, 10).forEach((jogador, index) => {

    const item =
        document.createElement("div");


    item.classList.add("jogador");


    let medalha = index + 1;


    if (index === 0) medalha = "🥇";
    if (index === 1) medalha = "🥈";
    if (index === 2) medalha = "🥉";


    item.innerHTML = `

        <div class="posicao">
            ${medalha}
        </div>

        <div class="nome-jogador">
            ${jogador.nome}
        </div>

        <strong>
            ${jogador.pontos}/${jogador.total}
        </strong>

    `;


    lista.appendChild(item);

});

</script>
