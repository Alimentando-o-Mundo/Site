</head>

<body>


<header>
        <section id="nav-bar">
        <a href="#" class="logo"><img src="src/logo-v2.png" alt="logo"></a>
            <nav id="nav_bar">
                <ul class="menu">
                    <li>
                        <a href="../A-inicio/A-index.html">Início</a>
                    </li>
                    <li>
                        <a href="/Site/B-Página_Tecnologia/B-tec.html">Tecnologia</a>
                    </li>
                    <li>
                        <a href="/Site/C-agricultura_lg_escala/C-agricultura.html">Agricultura em Larga Escala</a>

                    <li>

                    <li>
                        <a href="/Site/F-Quiz/quiz.html">Quiz</a>

                    </li>
                </ul>
            </nav>
            <i id="burguer" class="material-icons" onclick="clickMenu()">menu</i>
        </section>
        
    </header>


<main class="resultado">

    <div class="resultado-card">

        <div class="check">
            ✓
        </div>


        <span class="tag">
            DESAFIO FINALIZADO
        </span>


        <h1>
            QUIZ FINALIZADO!
        </h1>


        <p class="voce-acertou">
            Você acertou
        </p>


        <div class="pontuacao">

            <strong id="pontos">
                0
            </strong>

            <span>
                de 10
            </span>

        </div>


        <div class="mensagem">

            <strong id="mensagem">
                Muito bom!
            </strong>

            <p>
                Você demonstrou bons conhecimentos
                sobre produção de alimentos e
                sustentabilidade.
            </p>

        </div>


        <input
            id="nome"
            type="text"
            placeholder="Digite seu nome"
            maxlength="30"
        >


        <div class="botoes">

            <button
                class="btn-principal"
                onclick="salvarResultado()">

                SALVAR NO RANKING →

            </button>


            <button
                class="btn-secundario"
                onclick="location.href='quiz.html'">

                TENTAR NOVAMENTE

            </button>

        </div>

    </div>

</main>


<script>

const pontos =
    Number(localStorage.getItem("quizPontos")) || 0;

const total =
    Number(localStorage.getItem("quizTotal")) || 10;


document.getElementById("pontos")
    .textContent = pontos;


document.querySelector(".pontuacao span")
    .textContent = `de ${total}`;


function salvarResultado() {

    const nome =
        document.getElementById("nome").value.trim();


    if (!nome) {

        alert("Digite seu nome!");

        return;

    }


    const ranking =
        JSON.parse(
            localStorage.getItem("ranking")
        ) || [];


    ranking.push({

        nome: nome,

        pontos: pontos,

        total: total

    });


    ranking.sort((a, b) =>
        b.pontos - a.pontos
    );


    localStorage.setItem(
        "ranking",
        JSON.stringify(ranking)
    );


    window.location.href =
        "ranking.html";

}

</script>


</body>

</html>
